name: Update README stats cards

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 00:00 自动更新
  workflow_dispatch:        # 支持在 Actions 页面手动触发
  push:
    branches:
      - main
    paths:
      - '.github/workflows/readme-stats.yml'
      - 'README.md'

permissions:
  contents: write           # 允许把生成的卡片提交回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 卡片 1：GitHub Stats
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=jihandong&show_icons=true&count_private=true&theme=react&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      # 卡片 2：Top Languages
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=jihandong&hide=html,tex&langs_count=10&layout=compact&theme=react&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      # 把生成的卡片提交回仓库
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
